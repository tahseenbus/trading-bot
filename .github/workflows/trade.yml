# Runs the paper-trading bot on a schedule, for free, on GitHub's servers.
# Each run does ONE market check and commits the updated portfolio back
# to the repo so the next run resumes from where this one left off.
#
# Uses FAKE money only. There are no API keys or secrets involved.

name: Paper Trade

on:
  schedule:
    # Once an hour at :23 past (UTC). Deliberately NOT on the hour --
    # top-of-hour crons are the most likely to be delayed or dropped by
    # GitHub under load. Change to trade more/less often, e.g.
    # '*/15 * * * *' for every 15 minutes.
    - cron: "23 * * * *"
  # Lets you trigger a run by hand from the repo's "Actions" tab.
  workflow_dispatch:

# Allow the workflow to commit the updated state.json / trades.csv back.
permissions:
  contents: write

# Never let two runs overlap -- that could corrupt the saved state.
concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one trading check (hourly candles)
        run: python paper_trade.py --iterations 1 --timeframe 1h

      - name: Champion/Challenger -- all strategies compete in parallel
        run: python champion.py --iterations 1 --timeframe 1h

      - name: Commit the updated portfolio back to the repo
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No change this run (still waiting / holding) -- nothing to commit."
          else
            git commit -m "bot: trading update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
